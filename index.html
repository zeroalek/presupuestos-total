<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presupuestos Total</title>
<style>
  :root { color-scheme: light; --bg:#f4f3ef; --paper:#fff; --ink:#192820; --muted:#53655c; --line:#dae2dc; --accent:#185a43; --tint:#eaf3ed; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,sans-serif; }
  button,input { font:inherit; }
  .top { border-bottom:1px solid var(--line); padding:16px max(24px,calc((100% - 1220px)/2)); font-weight:750; }
  .top span { display:inline-grid; place-items:center; width:32px; height:32px; margin-right:9px; border-radius:9px; color:white; background:var(--accent); }
  main { max-width:1268px; margin:auto; padding:32px 24px 48px; }
  h1,h2,p { margin:0; }
  h1 { font-size:clamp(29px,4vw,40px); letter-spacing:-.045em; }
  .intro { margin:4px 0 24px; color:var(--muted); }
  .layout { display:grid; grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr); gap:22px; align-items:start; }
  .panel,.paper { background:var(--paper); border:1px solid var(--line); border-radius:16px; }
  .panel { padding:24px; }
  h2 { font-size:19px; letter-spacing:-.025em; }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0 24px; }
  label { display:grid; gap:5px; font-size:13px; font-weight:650; }
  label span { color:var(--muted); font-weight:400; }
  input { min-width:0; width:100%; min-height:42px; border:1px solid #acbbb3; border-radius:8px; background:white; padding:8px 10px; color:var(--ink); }
  :focus-visible { outline:3px solid #428969; outline-offset:2px; }
  .row-head,.item { display:grid; grid-template-columns:minmax(0,2fr) minmax(66px,.67fr) minmax(76px,.85fr) 40px; gap:8px; align-items:start; }
  .row-head { margin:12px 0 5px; color:var(--muted); font-size:12px; font-weight:700; }
  .item { margin-bottom:8px; }
  button { border:1px solid transparent; border-radius:8px; min-height:42px; padding:8px 13px; cursor:pointer; font-weight:700; }
  .remove,.add { background:var(--tint); color:var(--accent); }
  .remove { padding:0; font-size:20px; }
  .remove:disabled { opacity:.4; cursor:default; }
  .actions { margin-top:20px; border-top:1px solid var(--line); padding-top:16px; }
  .save { background:var(--accent); color:white; }
  .hint,.error { margin-top:8px; font-size:13px; }
  .hint { color:var(--muted); }
  .error { color:#9e2622; }
  .error:empty { display:none; }

  :root { --ink:#192c31; --muted:#52666c; --line:#dbe5e4; --accent:#185951; --tint:#e6f2ee; }
  body { background:#edf2f2; }
  .top { background:#142c31; color:#f5fbfa; padding-block:14px; letter-spacing:.02em; }
  .top span { background:#a7e4c9; color:#183630; }
  main { max-width:1370px; }
  .layout { grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr); gap:26px; }
  .panel { padding:clamp(16px,2.4vw,30px); box-shadow:0 12px 40px #173a3810; }
  .kicker { font-size:11px; font-weight:800; letter-spacing:.16em; color:var(--accent); margin-bottom:5px; }
  .styles { border:0; padding:0; margin:0 0 25px; min-width:0; }
  .styles legend { padding:0; margin-bottom:10px; font-size:19px; font-weight:700; letter-spacing:-.025em; }
  .choices { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .choice { position:relative; cursor:pointer; }
  .choice input { position:absolute; width:1px; min-height:0; height:1px; opacity:0; padding:0; }
  .swatch { display:grid; justify-items:center; gap:5px; padding:8px 3px 6px; border:1px solid var(--line); border-radius:9px; color:var(--ink); font-size:11px; }
  .choice input:checked + .swatch { box-shadow:inset 0 0 0 1px var(--accent); border-color:var(--accent); background:#edf8f4; }
  .choice input:focus-visible + .swatch { outline:3px solid #428969; outline-offset:2px; }
  .swatch svg { width:32px; height:41px; }
  .row-head,.item { grid-template-columns:minmax(0,1fr) minmax(58px,.36fr) minmax(66px,.43fr) 40px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; }
  .actions .error { width:100%; }
  .studio { position:sticky; top:12px; min-width:0; overflow:hidden; border:1px solid #304850; background:#1b333b; color:#f4faf9; border-radius:16px; box-shadow:0 20px 50px #173a3822; }
  .studio-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:13px 15px; border-bottom:1px solid #ffffff25; }
  .studio-title { font-weight:750; font-size:14px; }
  .badge { margin-left:6px; color:#b6edda; font-size:11px; }
  .badge::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:#91e6ba; margin-right:5px; vertical-align:2px; }
  .studio-tools { display:flex; align-items:center; gap:8px; font-size:12px; }
  .studio-tools button,.studio-tools a { min-height:32px; padding:5px 8px; background:#ffffff0b; border:1px solid #ffffff37; border-radius:6px; color:inherit; font:inherit; text-decoration:none; }
  .studio-tools a { display:inline-flex; align-items:center; }
  .studio-tools button:disabled { opacity:.42; cursor:default; }
  .page-viewport { max-height:72vh; overflow:auto; padding:clamp(10px,2vw,24px); background:#243e46; }
  .page-sheet { width:min(100%, 665px); margin:auto; aspect-ratio:595 / 842; background:white; box-shadow:0 10px 24px #05161970; }
  .page-sheet svg { width:100%; height:100%; display:block; }
  .studio-footer { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 15px; font-size:12px; color:#c8dfdc; }
  .studio-footer strong { font-size:15px; color:white; white-space:nowrap; }
  @media(max-width:850px) { .layout { grid-template-columns:1fr; } .studio { position:static; } .page-viewport { max-height:none; } }
  @media(max-width:450px) { .row-head,.item { grid-template-columns:minmax(0,1fr) 55px 62px 34px; } .swatch { font-size:10px; } }
</style>
</head>
<body>
<header class="top"><span aria-hidden="true">P</span>Presupuestos Total</header>
<main>
  <p class="kicker">ESTUDIO DE PRESUPUESTOS</p>
  <h1>Nuevo presupuesto</h1>
  <p class="intro">Elige un diseño, edita tus partidas y revisa cómo quedará el PDF.</p>
  <div class="layout">
    <form class="panel" id="editor" novalidate>
      <fieldset class="styles">
        <legend>Diseño del PDF</legend>
        <div class="choices" id="styles"></div>
      </fieldset>
      <h2>Datos del presupuesto</h2>
      <div class="fields">
        <label>Cliente<input id="client" maxlength="160" placeholder="Nombre o empresa" required></label>
        <label>Fecha<input id="date" type="date" required></label>
        <label>Tu nombre o empresa <span>Opcional</span><input id="issuer" maxlength="160"></label>
        <label>Referencia <span>Opcional</span><input id="reference" maxlength="60" placeholder="Ej. P-001"></label>
      </div>
      <h2>Partidas</h2>
      <div class="row-head" aria-hidden="true"><div>Descripción</div><div>Cantidad</div><div>Precio (€)</div><div></div></div>
      <div id="items"></div>
      <button class="add" type="button" id="add">+ Añadir partida</button>
      <div class="actions"><button class="add" type="button" id="load-example">Cargar ejemplo</button>
        <button class="save" type="submit">Descargar PDF</button>
        <p class="error" id="error" role="alert"></p>
      </div>
    </form>
    <section class="studio" aria-label="Vista previa del presupuesto">
      <div class="studio-bar">
        <div><span class="studio-title">Vista previa del PDF</span><span class="badge">En directo</span></div>
        <div class="studio-tools">
          <button type="button" id="previous-page" aria-label="Página anterior">←</button>
          <span id="page-count">1 / 1</span>
          <button type="button" id="next-page" aria-label="Página siguiente">→</button>
          <a id="open-pdf" target="_blank" rel="noopener">Abrir PDF ↗</a>
        </div>
      </div>
      <div class="page-viewport"><div class="page-sheet" id="page-sheet"></div></div>
      <div class="studio-footer"><span id="preview-summary"></span><strong id="preview-total"></strong></div>
    </section>
  </div>
</main>
<template id="row">
  <div class="item">
    <input data-field="description" placeholder="Ej. Diseño web" maxlength="160">
    <input data-field="quantity" inputmode="decimal" value="1" maxlength="10">
    <input data-field="price" inputmode="decimal" placeholder="0,00" maxlength="10">
    <button class="remove" type="button">×</button>
  </div>
</template>
<script>
  const byId = (id) => document.getElementById(id);
  const editor = byId('editor');
  const items = byId('items');
  const date = byId('date');
  const euros = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
  const quantityFormat = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 2 });
  const dateFormat = new Intl.DateTimeFormat('es-ES', { dateStyle: 'long' });
  const today = new Date();
  date.value = [today.getFullYear(), today.getMonth() + 1, today.getDate()]
    .map((part) => String(part).padStart(2, '0')).join('-');

  function scaledNumber(value) {
    const match = /^(\d{1,6})(?:[,.](\d{1,2}))?$/.exec(value.trim());
    if (!match) return null;
    return Number(match[1]) * 100 + Number((match[2] || '').padEnd(2, '0'));
  }

  function readRows() {
    return Array.from(items.children, (row) => {
      const descriptionInput = row.querySelector('[data-field=description]');
      const quantityInput = row.querySelector('[data-field=quantity]');
      const priceInput = row.querySelector('[data-field=price]');
      const description = descriptionInput.value.trim();
      const quantity = scaledNumber(quantityInput.value);
      const price = scaledNumber(priceInput.value);
      return {
        descriptionInput, quantityInput, priceInput, description, quantity, price,
        used: Boolean(description || priceInput.value.trim() || quantityInput.value.trim() !== '1'),
        complete: Boolean(description && quantity > 0 && price !== null)
      };
    });
  }

  function labelRows() {
    Array.from(items.children).forEach((row, index, rows) => {
      const label = 'Partida ' + (index + 1);
      row.querySelector('[data-field=description]').setAttribute('aria-label', label + ', descripción');
      row.querySelector('[data-field=quantity]').setAttribute('aria-label', label + ', cantidad');
      row.querySelector('[data-field=price]').setAttribute('aria-label', label + ', precio en euros');
      const remove = row.querySelector('.remove');
      remove.setAttribute('aria-label', 'Eliminar partida ' + (index + 1));
      remove.disabled = rows.length === 1;
    });
  }

  function addRow(focus) {
    const row = byId('row').content.firstElementChild.cloneNode(true);
    items.append(row);
    labelRows();
    refresh();
    if (focus) row.querySelector('input').focus();
  }

  function refresh() {
    byId('error').textContent = '';
    queuePreview();
  }

  function showError(message, input) {
    byId('error').textContent = message;
    input.focus();
  }

  function pdfText(value) {
    // The standard PDF Helvetica font uses Windows-1252.
    const extra = '€\0‚ƒ„…†‡ˆ‰Š‹Œ\0Ž\0\0‘’“”•–—˜™š›œ\0žŸ';
    return Array.from(value.normalize('NFC'), (character) => {
      const code = character.codePointAt(0);
      const special = extra.indexOf(character);
      const byte = code >= 32 && code <= 126 || code >= 160 && code <= 255
        ? code : special >= 0 && code !== 0 ? 128 + special : 63;
      return byte.toString(16).padStart(2, '0');
    }).join('');
  }


  const templates = {
    atlas: {name:'Atlas', caption:'Corporativo', kind:'band', ink:'#162842', accent:'#245cc5', tint:'#eaf1ff', hero:'#142b52', paper:'#ffffff', muted:'#4d6380', line:'#d8e3f2', serif:false},
    oliva: {name:'Oliva', caption:'Natural', kind:'rail', ink:'#243c33', accent:'#28624c', tint:'#e9f1e7', hero:'#28624c', paper:'#fdfdf8', muted:'#53675b', line:'#dce7dc', serif:false},
    editorial: {name:'Editorial', caption:'Elegante', kind:'editorial', ink:'#39282d', accent:'#8b3e50', tint:'#f7e9e9', hero:'#8b3e50', paper:'#fffaf3', muted:'#68545a', line:'#eadbda', serif:true},
    prisma: {name:'Prisma', caption:'Contemporáneo', kind:'prisma', ink:'#272147', accent:'#603ac6', tint:'#f0eafa', hero:'#44249b', paper:'#ffffff', muted:'#5b5376', line:'#e5dcf3', serif:false}
  };
  let styleId = 'atlas';
  let previewTimer, previewUrl, previewVersion = -1, documentVersion = 0;
  let pageIndex = 0;
  let currentPages = [];
  const svgNS = 'http://www.w3.org/2000/svg';
  const measure = document.createElement('canvas').getContext('2d');

  function fontFor(font) {
    return font === 'F3' ? { family:'Times New Roman', weight:400 }
      : { family:'Arial', weight:font === 'F2' ? 700 : 400 };
  }

  function textWidth(value, size, font) {
    const { family, weight } = fontFor(font);
    measure.font = weight + ' ' + size + 'px "' + family + '"';
    return measure.measureText(value).width;
  }

  function wrapToWidth(value, width, size, font) {
    let remaining = Array.from(value);
    const lines = [];
    while (remaining.length) {
      let fit = 1;
      while (fit < remaining.length && textWidth(remaining.slice(0, fit + 1).join(''), size, font) <= width) fit++;
      if (fit < remaining.length) {
        const boundary = remaining.slice(0, fit + 1).lastIndexOf(' ');
        if (boundary > 0) fit = boundary;
      }
      lines.push(remaining.slice(0, fit).join(''));
      remaining = remaining.slice(fit);
      while (remaining[0] === ' ') remaining.shift();
    }
    return lines;
  }

  function composePages(rows) {
    const theme = templates[styleId];
    const pages = [];
    const reference = byId('reference').value.trim();
    const issuer = byId('issuer').value.trim();
    const client = byId('client').value.trim() || 'Por indicar';
    const dateLabel = date.value ? dateFormat.format(new Date(date.value + 'T12:00:00')) : 'Por indicar';
    const titleFont = theme.serif ? 'F3' : 'F2';
    let page, y, stripe = 0;

    function rect(x,y,w,h,color) { page.push({type:'rect',x,y,w,h,color}); }
    function line(x,y,x2,y2,color,width=1) { page.push({type:'line',x,y,x2,y2,color,width}); }
    function write(value,x,y,size,color,font='F1',right=false) {
      const width = textWidth(value,size,font);
      page.push({type:'text',value,x:right ? x-width : x,y,size,color,font,width});
    }

    function startPage(first) {
      page = [];
      pages.push(page);
      rect(0,0,595,842,theme.paper);
      if (theme.kind === 'band') {
        rect(0,0,595,149,theme.hero);
        rect(0,144,595,5,theme.accent);
        rect(485,0,110,144,'#203d69');
        line(515,42,555,42,'#9cc0ff',2);
        line(535,31,535,53,'#9cc0ff',2);
      } else if (theme.kind === 'rail') {
        rect(0,0,17,842,theme.hero);
        rect(31,26,533,109,theme.tint);
        rect(522,43,20,20,theme.accent);
        rect(530,51,20,20,'#a4c4a8');
      } else if (theme.kind === 'editorial') {
        line(42,30,553,30,theme.accent,2);
        line(42,128,553,128,theme.accent);
        write('P',543,104,68,theme.tint,'F3',true);
      } else {
        rect(0,0,595,142,theme.hero);
        rect(441,0,154,93,'#643bc4');
        rect(489,48,106,94,'#794cd6');
        rect(552,19,43,41,'#b084ed');
      }
      const dark = theme.kind === 'band' || theme.kind === 'prisma';
      write('PROPUESTA ECONÓMICA',44,63,9,dark ? '#e2e8ff' : theme.accent,'F2');
      write('Presupuesto',42,113,theme.serif ? 48 : 42,dark ? '#ffffff' : theme.ink,titleFont);
      y = theme.kind === 'band' ? 174 : 166;
      if (first) {
        const blocks = [
          {x:42,w:234, heading:'CLIENTE', value:client},
          {x:307,w:246, heading:'EMISOR', value:issuer || 'Por indicar'}
        ];
        for (const block of blocks) {
          write(block.heading,block.x,y+8,8,theme.accent,'F2');
          const lines = wrapToWidth(block.value,block.w,12,'F2');
          lines.forEach((value,i) => write(value,block.x,y+28+i*15,12,theme.ink,'F2'));
          block.height = 28+(lines.length-1)*15;
        }
        y += Math.max(...blocks.map(block => block.height)) + 25;
        line(42,y-10,553,y-10,theme.line);
        const info = 'Fecha: '+dateLabel+(reference ? '    ·    Ref. '+reference : '');
        const infoLines = wrapToWidth(info,511,10,'F1');
        infoLines.forEach((value,i) => write(value,42,y+6+i*14,10,theme.muted));
        y += 14*infoLines.length+18;
      } else {
        const info = reference ? 'Continuación  ·  Ref. '+reference : 'Continuación del presupuesto';
        write(info,42,y+9,10,theme.muted);
        y += 25;
      }
      rect(42,y,511,29,theme.kind === 'band' ? theme.hero : theme.tint);
      const headerColor = theme.kind === 'band' ? '#ffffff' : theme.accent;
      write('DESCRIPCIÓN',53,y+18,8,headerColor,'F2');
      write('CANT.',344,y+18,8,headerColor,'F2',true);
      write('PRECIO',432,y+18,8,headerColor,'F2',true);
      write('IMPORTE',542,y+18,8,headerColor,'F2',true);
      y += 29;
      stripe = 0;
    }

    startPage(true);
    let total = 0;
    if (!rows.length) {
      write('Las partidas completas aparecerán aquí.',53,y+22,10,theme.muted);
      y += 36;
    }
    for (const row of rows) {
      const lines = wrapToWidth(row.description,235,10,'F1');
      const height = Math.max(33,lines.length*14+15);
      if (y+height > 750) startPage(false);
      if (stripe++ % 2 === 0) rect(42,y,511,height,theme.tint);
      lines.forEach((value,i) => write(value,53,y+20+i*14,10,theme.ink));
      const cents = Math.round(row.quantity*row.price/100);
      total += cents;
      write(quantityFormat.format(row.quantity/100),344,y+20,10,theme.ink,'F1',true);
      write(euros.format(row.price/100),432,y+20,10,theme.ink,'F1',true);
      write(euros.format(cents/100),542,y+20,10,theme.ink,'F2',true);
      y += height;
      line(42,y,553,y,theme.line,.6);
    }
    if (y+79 > 771) startPage(false);
    const totalLabel = euros.format(total/100);
    y += 17;
    rect(302,y,251,54,theme.hero);
    write('TOTAL',314,y+33,9,'#ffffff','F2');
    const totalSize = Math.min(22,Math.floor(22*174/Math.max(174,textWidth(totalLabel,22,titleFont))));
    write(totalLabel,540,y+34,totalSize,'#ffffff',titleFont,true);
    pages.forEach((commands,i) => {
      page = commands;
      line(42,785,553,785,theme.line);
      write('PRESUPUESTO',42,807,8,theme.muted,'F2');
      write((i+1)+' / '+pages.length,553,807,9,theme.muted,'F1',true);
    });
    return {pages,totalLabel};
  }

  function createSvgPage(commands) {
    function element(tag, attributes) {
      const node = document.createElementNS(svgNS,tag);
      for (const [key,value] of Object.entries(attributes)) node.setAttribute(key,value);
      return node;
    }
    const svg = element('svg',{viewBox:'0 0 595 842',role:'img','aria-label':'Página '+(pageIndex+1)+' del presupuesto'});
    for (const shape of commands) {
      const {x,y,color} = shape;
      if (shape.type === 'rect') svg.append(element('rect',{x,y,width:shape.w,height:shape.h,fill:color}));
      else if (shape.type === 'line') svg.append(element('line',{x1:x,y1:y,x2:shape.x2,y2:shape.y2,stroke:color,'stroke-width':shape.width}));
      else {
        const {family,weight} = fontFor(shape.font);
        const node = element('text',{x,y,fill:color,'font-family':family,'font-weight':weight,'font-size':shape.size,textLength:shape.width,lengthAdjust:'spacingAndGlyphs'});
        node.textContent = shape.value;
        svg.append(node);
      }
    }
    return svg;
  }

  function showPreviewPage() {
    pageIndex = Math.min(Math.max(pageIndex,0),currentPages.length-1);
    byId('page-sheet').replaceChildren(createSvgPage(currentPages[pageIndex]));
    byId('page-count').textContent = (pageIndex+1)+' / '+currentPages.length;
    byId('previous-page').disabled = pageIndex === 0;
    byId('next-page').disabled = pageIndex === currentPages.length-1;
  }

  function queuePreview() {
    documentVersion++;
    clearTimeout(previewTimer);
    previewTimer = setTimeout(updatePreview,70);
  }

  function updatePreview() {
    if (previewVersion === documentVersion) return;
    const rows = readRows().filter(row => row.complete);
    const {pages,totalLabel} = composePages(rows);
    currentPages = pages;
    previewVersion = documentVersion;
    showPreviewPage();
    byId('preview-total').textContent = totalLabel;
    byId('preview-summary').textContent = templates[styleId].name+' · A4 · '+rows.length+(rows.length === 1 ? ' partida' : ' partidas');
  }

  function rgb(color) {
    return color.slice(1).match(/../g).map(channel => (parseInt(channel,16)/255).toFixed(4)).join(' ');
  }

  function pdfCommand(shape) {
    const {x,y,color} = shape;
    const c = rgb(color);
    if (shape.type === 'rect') return c+' rg '+x+' '+(842-y-shape.h)+' '+shape.w+' '+shape.h+' re f\n';
    if (shape.type === 'line') return c+' RG '+shape.width+' w '+x+' '+(842-y)+' m '+shape.x2+' '+(842-shape.y2)+' l S\n';
    return c+' rg BT /'+shape.font+' '+shape.size+' Tf 1 0 0 1 '+Number(x.toFixed(2))+' '+(842-y)+' Tm <'+pdfText(shape.value)+'> Tj ET\n';
  }

  function initStudio() {
    const styles = byId('styles');
    for (const [id,theme] of Object.entries(templates)) {
      const label = document.createElement('label');
      label.className = 'choice';
      label.innerHTML = '<input type="radio" name="pdf-style" value="'+id+'"><span class="swatch"><svg viewBox="0 0 30 39" aria-hidden="true"><rect x="1" y="1" width="28" height="37" rx="2" fill="'+theme.paper+'" stroke="'+theme.line+'"/><rect x="4" y="4" width="22" height="9" rx="1" fill="'+theme.hero+'"/><path d="M5 19h20M5 23h17M5 27h20" stroke="'+theme.line+'" stroke-width="1.5"/><rect x="14" y="31" width="11" height="3" rx="1" fill="'+theme.accent+'"/></svg>'+theme.name+'</span>';
      const radio = label.firstElementChild;
      radio.title = theme.caption;
      radio.checked = id === styleId;
      styles.append(label);
    }
    styles.addEventListener('change',event => {
      if (!Object.hasOwn(templates,event.target.value)) return;
      styleId = event.target.value;
      pageIndex = 0;
      saveDraft();
      queuePreview();
    });
    byId('previous-page').addEventListener('click',() => { pageIndex--; showPreviewPage(); });
    byId('next-page').addEventListener('click',() => { pageIndex++; showPreviewPage(); });
    const opener = byId('open-pdf');
    opener.href = '#';
    opener.addEventListener('click',() => {
      updatePreview();
      if (previewUrl) {
        const previous = previewUrl;
        setTimeout(() => URL.revokeObjectURL(previous),30000);
      }
      previewUrl = URL.createObjectURL(buildPdf(currentPages));
      opener.href = previewUrl;
    });
    updatePreview();
  }

  function buildPdf(pages) {
    // Keep streams ASCII so string lengths are the byte offsets required by PDF.
    const objects = [
      '<< /Type /Catalog /Pages 2 0 R >>',
      `<< /Type /Pages /Count ${pages.length} /Kids [${pages.map((_, index) => (6 + index * 2) + ' 0 R').join(' ')}] >>`,
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman /Encoding /WinAnsiEncoding >>'
    ];
    for (const page of pages) {
      const stream = page.map(pdfCommand).join('');
      const streamId = objects.length + 2;
      objects.push(
        `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents ${streamId} 0 R >>`,
        `<< /Length ${stream.length} >>\nstream\n${stream}endstream`
      );
    }
    let pdf = '%PDF-1.4\n';
    const offsets = [0];
    objects.forEach((object, index) => {
      offsets.push(pdf.length);
      pdf += `${index + 1} 0 obj\n${object}\nendobj\n`;
    });
    const xref = pdf.length;
    pdf += `xref\n0 ${offsets.length}\n0000000000 65535 f \n`;
    for (const offset of offsets.slice(1)) pdf += String(offset).padStart(10, '0') + ' 00000 n \n';
    pdf += `trailer\n<< /Size ${offsets.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
    return new Blob([pdf], { type: 'application/pdf' });
  }

  function downloadPdf() {
    updatePreview();
    const url = URL.createObjectURL(buildPdf(currentPages));
    const link = document.createElement('a');
    const reference = byId('reference').value.trim().replace(/[^a-zA-Z0-9_-]+/g, '-').replace(/^-+|-+$/g, '');
    link.href = url;
    link.download = 'presupuesto-' + (reference || date.value) + '.pdf';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  editor.addEventListener('input', refresh);
  byId('add').addEventListener('click', () => addRow(true));
  items.addEventListener('click', (event) => {
    const button = event.target.closest('.remove');
    if (!button || button.disabled) return;
    const row = button.closest('.item');
    const neighbor = row.nextElementSibling || row.previousElementSibling;
    row.remove();
    labelRows();
    refresh();
    neighbor.querySelector('input').focus();
  });
  editor.addEventListener('submit', (event) => {
    event.preventDefault();
    const client = byId('client');
    if (!client.value.trim()) return showError('Escribe el nombre del cliente.', client);
    if (!date.value) return showError('Indica la fecha del presupuesto.', date);
    const rows = readRows();
    const used = rows.filter((row) => row.used);
    if (!used.length) return showError('Añade al menos una partida.', rows[0].descriptionInput);
    for (const row of used) {
      if (!row.description) return showError('Escribe la descripción de esta partida.', row.descriptionInput);
      if (!(row.quantity > 0)) return showError('Introduce una cantidad mayor que cero, con hasta dos decimales.', row.quantityInput);
      if (row.price === null) return showError('Introduce un precio válido, con hasta dos decimales.', row.priceInput);
    }
    refresh();
    downloadPdf();
  });
  addRow(false);
  byId('load-example').addEventListener('click', () => {
    const client = byId('client');
    const hasData = client.value.trim() || readRows().some((row) => row.used);

    if (hasData && !window.confirm('¿Sustituir el cliente y las partidas por el ejemplo?')) {
      return;
    }

    client.value = 'Cliente de ejemplo';
    items.replaceChildren();

    const examples = [
      { description: 'Diseño de página web', quantity: '1', price: '250' },
      { description: 'Mantenimiento mensual', quantity: '2', price: '35' }
    ];

    for (const example of examples) {
      addRow(false);
      const row = items.lastElementChild;
      for (const [field, value] of Object.entries(example)) {
        row.querySelector('[data-field=' + field + ']').value = value;
      }
    }

    refresh();
  });
  const draftKey = 'presupuestos-total:borrador';
  const draftFields = ['client', 'date', 'issuer', 'reference'];
  const itemFields = ['description', 'quantity', 'price'];

  function saveDraft() {
    try {
      const fields = draftFields.map((id) => byId(id).value);
      const rows = Array.from(items.children, (row) =>
        itemFields.map((field) => row.querySelector(`[data-field="${field}"]`).value)
      );
      localStorage.setItem(draftKey, JSON.stringify({ fields, rows, styleId }));
    } catch (error) {
      console.warn('No se pudo guardar el borrador.', error);
    }
  }

  function restoreDraft() {
    try {
      const draft = JSON.parse(localStorage.getItem(draftKey));
      if (!draft || !Array.isArray(draft.fields) || !Array.isArray(draft.rows) || !draft.rows.length) return;
      if (Object.hasOwn(templates,draft.styleId)) styleId = draft.styleId;

      draftFields.forEach((id, index) => {
        byId(id).value = draft.fields[index];
      });

      items.replaceChildren();
      for (const values of draft.rows) {
        addRow(false);
        itemFields.forEach((field, index) => {
          items.lastElementChild.querySelector(`[data-field="${field}"]`).value = values[index];
        });
      }
      refresh();
    } catch (error) {
      console.warn('No se pudo recuperar el borrador.', error);
    }
  }

  restoreDraft();
  initStudio();
  editor.addEventListener('input', saveDraft);
  editor.addEventListener('click', (event) => {
    if (event.target.closest('#add, #load-example, .remove')) saveDraft();
  });
</script>
</body>
</html>
